<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="VECLab">
  <!--
    App icon: an Erlenmeyer flask with a filled level.

    Drawn rather than exported so it stays a few hundred bytes and needs no binary in the
    repository. The gradient is the brand accent; the liquid level is the product's one
    vivid element, matching the pH meter.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f6480"/>
      <stop offset="1" stop-color="#14867f"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#g)"/>
  <path d="M13 6h6v6.6l5.2 9.6A2.6 2.6 0 0 1 21.9 26H10.1a2.6 2.6 0 0 1-2.3-3.8L13 12.6V6Z"
        fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linejoin="round"/>
  <path d="M9.6 19.4h12.8l1.8 3.3A2.1 2.1 0 0 1 22.3 26H9.7a2.1 2.1 0 0 1-1.9-3.3l1.8-3.3Z"
        fill="#9fe8d8"/>
  <path d="M11.6 6h8.8" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round"/>
</svg>
