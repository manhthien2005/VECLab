# Local/preview Supabase project configuration for VECLab.
#
# Source of truth: docs/system-architecture.md §3.2 (Supabase Auth + PostgreSQL,
# RLS plus minimal grants) and §17 (security boundaries).
#
# This file holds NO secret values. API keys, JWT secrets and database passwords
# are generated by `supabase start` into `.temp/` (git-ignored) and read by the
# application only through environment variables — see `.env.example`
# (NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
# SUPABASE_SERVICE_ROLE_KEY).

project_id = "veclab"

[api]
enabled = true
# REST/GoTrue gateway port; matches NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
port = 54321
# Only `public` is exposed over PostgREST. The server-only RPCs live in `public`
# with EXECUTE revoked from anon/authenticated (migrations/20260909000600).
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# Attempt lists are paginated in the application layer
# (docs/system-architecture.md §16); this caps accidental unbounded reads.
max_rows = 1000

[db]
# Direct Postgres port for local tooling (`psql postgresql://postgres@127.0.0.1:54322/postgres`).
port = 54322
major_version = 17

[db.migrations]
# Schema changes only ever land through versioned migrations
# (docs/data-and-state-model.md §21.1).
schema_paths = []

[studio]
enabled = true
port = 54323

[inbucket]
# Local mail catcher for verification/password-reset emails
# (docs/system-architecture.md §11.1). No hosted mail provider, no secrets.
enabled = true
port = 54324

[auth]
enabled = true
# Next.js dev origin. docs/system-architecture.md §11.
site_url = "http://localhost:3000"
# Localhost variants plus Vercel preview deployments (docs/system-architecture.md §3.5).
additional_redirect_urls = [
  "http://127.0.0.1:3000",
  "http://localhost:3000/**",
  "https://*.vercel.app/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
allow_manual_linking = false
enable_signup = true
# Guest mode is a first-class local-storage path, not an anonymous server account
# (docs/system-architecture.md §18.4): guest data never reaches Supabase.
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local development only: confirmation emails are impractical against a throwaway
# database. Preview/production deployments enable confirmations in the project
# dashboard configuration, not in this file.
enable_confirmations = false

[analytics]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true
policy = "oneshot"

[functions]
verify_jwt = true
